<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Код авторизации — prosto rama</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0;background:#BFB8AD;color:#0A0A0A;font-family:Inter,sans-serif;font-weight:400}
main{max-width:760px;margin:0 auto;padding:48px 16px 64px}
a{color:inherit}
.back{font-size:11px;letter-spacing:6px;text-transform:uppercase;font-weight:300;text-decoration:none}
h1{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(30px,7vw,48px);line-height:1.05;text-transform:uppercase;margin:32px 0 8px}
p,li{font-size:15px;line-height:1.65}
code{display:block;word-break:break-all;background:#0A0A0A;color:#BFB8AD;padding:14px;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Код авторизации</h1>
<p id="msg">Скопируй код ниже и пришли его Сириусу в Telegram.</p>
<code id="code"></code>
</main>
<script>
var p=new URLSearchParams(location.search);
document.getElementById("code").textContent=p.get("code")||p.get("error_description")||p.get("error")||"кода нет";
</script>
</body>
</html>
